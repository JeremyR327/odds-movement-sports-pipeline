name: Test new pulls

# Manual run: books (The Odds API, CBB only = 2 credits), scores (NFL/CFB/NBA finals), then the CBB
# pull with the small-conference context flags, and saves everything like a normal pull.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: manual-pull
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyarrow (cbb_pull.py reads cbbdata's Parquet ratings)
        run: pip install --quiet pyarrow
      - name: Books (The Odds API, CBB only)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python books_pull.py CBB
        continue-on-error: true
      - name: Scores (finals + closes, last 8 days)
        run: python scores_pull.py 8
        continue-on-error: true
      - name: CBB pull with context flags
        env:
          CBD_API_KEY: ${{ secrets.CBD_API_KEY }}
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          CBD_USERNAME: ${{ secrets.CBD_USERNAME }}
          CBD_PASSWORD: ${{ secrets.CBD_PASSWORD }}
          CBD_EMAIL: ${{ secrets.CBD_EMAIL }}
        run: python cbb_pull.py
        continue-on-error: true
      - name: Save data to the repo
        run: |
          git config user.name "test-pull-bot"
          git config user.email "actions@users.noreply.github.com"
          python save_pull.py "Test pull"
      - name: Show results
        if: always()
        run: |
          cat data/books/status.json || true
          cat data/results/status.json || true
          python -c "import json; s=json.load(open('data/cbb/latest/status.json')); print({k: s.get(k) for k in ('espn','books','context','results','lag_flags','early_flags','rot_flags','fat_flags','alt_flags')})"
