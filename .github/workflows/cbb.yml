name: CBB model pull

on:
  # Manual runs only. Scheduled CBB pulls run inside the Pipeline loop (loop.yml).
  workflow_dispatch: {}

permissions:
  contents: write

# Same group as the TeamRankings pull so the manual pulls never push to main at the same time.
concurrency:
  group: manual-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyarrow (reads cbbdata's Parquet ratings)
        run: pip install --quiet pyarrow
      - name: Build the CBB slate (Torvik + TR + BPI vs DraftKings lines) and grade yesterday
        id: pull
        env:
          CBD_API_KEY: ${{ secrets.CBD_API_KEY }}
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          CBD_USERNAME: ${{ secrets.CBD_USERNAME }}
          CBD_PASSWORD: ${{ secrets.CBD_PASSWORD }}
          CBD_EMAIL: ${{ secrets.CBD_EMAIL }}
        run: python cbb_pull.py
        continue-on-error: true
      - name: Save data to the repo
        run: |
          git config user.name "cbb-pull-bot"
          git config user.email "actions@users.noreply.github.com"
          python save_pull.py "CBB pull"   # commit own files, rebuild data/latest/ on newest main, push (no conflicts)
      - name: Fail loudly if ESPN or Torvik failed
        if: steps.pull.outcome == 'failure'
        run: |
          cat data/cbb/latest/status.json
          exit 1
